<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09090b"><meta name="apple-mobile-web-app-capable" content="yes"><title>Vinted Scout</title><link rel="manifest" href="manifest.json"><style>
*{box-sizing:border-box}body{margin:0;background:#09090b;color:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding-bottom:85px}header{padding:22px 17px 10px;position:sticky;top:0;background:#09090bee;backdrop-filter:blur(18px);z-index:3}h1{margin:0;font-size:26px}.sub,.muted,.source{color:#92929b;font-size:12px}main{padding:8px 15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat,.card,.notice{background:#151519;border:1px solid #29292f;border-radius:18px}.stat{padding:15px}.stat b{display:block;font-size:28px;margin:3px 0}.section{font-size:18px;font-weight:700;margin:22px 0 10px}.card{padding:15px;margin:10px 0}.row{display:flex;justify-content:space-between;gap:10px}.name{font-weight:700}.price{font-weight:700}.bar{height:6px;background:#29292f;border-radius:99px;margin:12px 0}.fill{height:100%;background:#eee;border-radius:99px}.metrics{display:flex;justify-content:space-between;color:#92929b;font-size:11px}.green{color:#a6e985}.save{background:transparent;border:1px solid #33333a;color:white;border-radius:10px;padding:7px 9px}.source{margin-top:10px;line-height:1.4}.notice{padding:13px;font-size:11px;line-height:1.5;color:#92929b}.search{width:100%;padding:12px;border-radius:13px;border:1px solid #29292f;background:#151519;color:#fff;font-size:16px;outline:0}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#151519f5;border-top:1px solid #29292f;padding-bottom:env(safe-area-inset-bottom);z-index:4}.nav button{flex:1;background:none;border:0;color:#777;padding:10px 2px;font-size:11px}.nav button.active{color:#fff}.ico{display:block;font-size:21px;margin-bottom:2px}</style></head>
<body><header><h1>Vinted Scout</h1><div class="sub">UK weekly resale intelligence</div></header><main id="app"></main>
<nav class="nav"><button id="home" onclick="tab='home';render()"><span class="ico">⌂</span>Home</button><button id="trends" onclick="tab='trends';render()"><span class="ico">↗</span>Trends</button><button id="source" onclick="tab='source';render()"><span class="ico">£</span>Source</button><button id="saved" onclick="tab='saved';render()"><span class="ico">♡</span>Saved</button></nav>
<script>
let D,tab='home',saved=JSON.parse(localStorage.vs_saved||'[]');
async function load(){D=await (await fetch('data.json?v='+Date.now())).json();render()}
function p(x){return Math.round((x.saleLow+x.saleHigh)/2-x.maxBuy)}
function card(x){let s=saved.includes(x.name);return `<article class="card"><div class="row"><div><div class="name">${x.name}</div><div class="muted">${x.brand} · ${x.category}</div></div><button class="save" onclick="saveItem(${JSON.stringify(x.name)})">${s?'♥ Saved':'♡ Save'}</button></div><div class="row" style="margin-top:14px"><span class="muted">Sale range</span><b>£${x.saleLow}–£${x.saleHigh}</b></div><div class="row" style="margin-top:7px"><span class="muted">Target buy ≤</span><b>£${x.maxBuy}</b></div><div class="bar"><div class="fill" style="width:${x.demand}%"></div></div><div class="metrics"><span>Demand ${x.demand}</span><span class="green">${x.trend}</span><span>${x.sellThrough}</span><span>~£${p(x)} room</span></div><div class="source">${x.why}<br>Source: ${x.source}</div></article>`}
function render(){let o=D.opportunities,top=[...o].sort((a,b)=>b.demand-a.demand),rise=[...o].sort((a,b)=>parseInt(b.trend)-parseInt(a.trend));let h='';
if(tab==='home')h=`<div class="grid"><div class="stat"><span class="muted">Top demand</span><b>${top[0].demand}</b><span class="muted">${top[0].brand}</span></div><div class="stat"><span class="muted">Fastest rising</span><b>${rise[0].trend}</b><span class="muted">${rise[0].brand}</span></div></div><div class="section">This week's opportunities</div>${o.slice(0,6).map(card).join('')}<div class="notice">Data snapshot: ${D.meta.lastUpdated}. The app and weekly data are separate, so the data file can be updated without rebuilding the interface.</div>`;
if(tab==='trends')h=`<div class="section">Rising opportunities</div>${rise.map(card).join('')}<div class="section">UK market snapshot</div>${D.market.topBrands.map(b=>`<div class="card"><div class="row"><b>${b.brand}</b><span>${b.sellThrough}</span></div><div class="muted" style="margin-top:6px">${b.sold30d.toLocaleString()} observed sales · avg ${b.avg}</div></div>`).join('')}`;
if(tab==='source')h=`<div class="section">Find an item</div><input class="search" placeholder="Search brand, item or category…" oninput="filter(this.value)"><div id="list">${o.map(card).join('')}</div>`;
if(tab==='saved'){let a=o.filter(x=>saved.includes(x.name));h=`<div class="section">Saved items</div>${a.length?a.map(card).join(''):'<div class="notice">No saved items yet. Tap ♡ Save on an opportunity.</div>'}`}
document.getElementById('app').innerHTML=h;document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));document.getElementById(tab).classList.add('active')}
function filter(q){q=q.toLowerCase();document.getElementById('list').innerHTML=D.opportunities.filter(x=>(x.name+x.brand+x.category).toLowerCase().includes(q)).map(card).join('')}
function saveItem(n){saved=saved.includes(n)?saved.filter(x=>x!==n):[...saved,n];localStorage.vs_saved=JSON.stringify(saved);render()}load();
</script></body></html>
